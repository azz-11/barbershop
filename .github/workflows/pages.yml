name: نشر عناياتي على GitHub Pages

# كل دمج في main يُنشر تلقائياً: تُنسخ ملفات الموقع إلى فرع gh-pages
# وGitHub Pages يعرضها على https://azz-11.github.io/barbershop/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تجهيز ملفات الموقع
        run: |
          mkdir -p _site
          cp -r index.html dashboard.html admin.html manifest.webmanifest sw.js css js fonts icons manifests _site/
          touch _site/.nojekyll

      - name: النشر إلى فرع gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "نشر من ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
